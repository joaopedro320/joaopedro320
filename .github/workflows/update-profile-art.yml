name: Update profile art

"on":
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília, todo dia
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "contrib-heatmap.svg"
      - "data/contributions.json"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py ${{ github.repository_owner }}
      - run: python scripts/render_heatmap_svg.py
      - name: Sincroniza com o main antes de commitar
        run: git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza grafico de contribuicoes [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
