name: Make portrait

# Gera o retrato em halftone a partir da sua foto de perfil do GitHub.
# Roda quando os scripts mudam ou pelo botão "Run workflow" (ex.: depois de trocar a foto).
"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/prep_photo.py"
      - "scripts/make_halftone_svg.py"
      - "scripts/make_info_card.py"
      - "scripts/make_skills_svg.py"
      - ".github/workflows/make-portrait.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow numpy opencv-python-headless "rembg[cpu]"
      - name: Baixa a foto de perfil
        run: curl -sSL "https://github.com/${{ github.repository_owner }}.png?size=460" -o source-photo.png
      - run: python scripts/prep_photo.py source-photo.png
      - run: python scripts/make_info_card.py
      - run: python scripts/make_skills_svg.py
      - run: python scripts/make_halftone_svg.py
      - name: Sincroniza com o main antes de commitar
        run: git pull --rebase --autostash origin main
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: gera retrato e paineis [skip ci]"
          file_pattern: "malta-portrait.svg info-card.svg skills.svg data/portrait-cutout.png"
